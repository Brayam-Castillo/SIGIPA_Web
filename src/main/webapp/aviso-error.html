<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>Aviso de error | SIGIPA</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="assets/css/estilos.css">
  </head>

  <body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <div class="row justify-content-center w-100 mx-0">
        <div class="col-12 col-sm-auto px-0">
          <section class="acceso aviso-error" aria-labelledby="titulo-error">
            <div class="marca d-flex align-items-center">
              <span class="marca-icono" aria-hidden="true"></span>
              <span>SIGIPA</span>
            </div>

            <div class="icono-error d-flex align-items-center justify-content-center"
                 aria-hidden="true">!</div>

            <h1 id="titulo-error" class="acceso-titulo">
              No fue posible continuar
            </h1>

            <p class="mensaje-error">
              Revise la información ingresada<br>
              e inténtelo de nuevo.
            </p>

            <div class="detalle-error">
              <p class="detalle-titulo">Ejemplo: datos de acceso incorrectos.</p>
              <p class="detalle-texto">Compruebe usuario y contraseña.</p>
            </div>

            <a class="btn btn-acceso w-100 d-flex align-items-center justify-content-center" href="index.html"
            >Volver a intentar</a>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>

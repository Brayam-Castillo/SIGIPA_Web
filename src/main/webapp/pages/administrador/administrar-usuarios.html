<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Administrar usuarios · SIGIPA</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script defer src="../../assets/js/administrar-usuarios.js"></script>
        <style>
            body{font:16px/1.5 system-ui,sans-serif;color:#19312a;background:#f5f8f6}
            main{max-width:1120px;margin:auto;padding:3rem 1rem}
            header,footer{display:flex;align-items:center;justify-content:space-between;gap:.7rem;flex-wrap:wrap}
            section,dialog{background:white;border:1px solid #cad8d1;border-radius:.7rem;padding:1rem}
            section{overflow-x:auto}table{width:100%;border-collapse:collapse}
            th,td{padding:.65rem;border-bottom:1px solid #e0e8e3}
            button{margin:.15rem}
            dialog{width:min(92vw,440px)}
            dialog::backdrop{background:#10241c85}
            label,input{display:block;width:100%}
            label{margin-bottom:.8rem}[hidden]{display:none!important}
        </style>
    </head>
    <body>
        <main>
            <a href="panel-administrador.html" class="btn btn-secondary">Volver al panel</a>
            <header>
                <h1>Administrar usuarios</h1>
                <a class="btn btn-success" href="registrar-usuario.html">Registrar usuario</a>
            </header>
            <p id="estado" role="status"></p>
            <section aria-label="Cuentas">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="filas"></tbody>
                </table>
            </section>
            <dialog id="dialogo">
                <form id="formulario">
                    <h2 id="titulo">Administrar usuario</h2>
                    <p id="cuenta"></p>
                <fieldset id="perfil">
                    <label>Nombre<input name="nombre" maxlength="50" required></label>
                    <label>Usuario<input name="usuario" minlength="3" maxlength="50" required></label>
                    <label>Correo<input name="correo" type="email" maxlength="80" required></label>
                </fieldset>
                <fieldset id="seguridad">
                    <label>Nueva contraseña<input type="password" name="clave" autocomplete="new-password" minlength="8" maxlength="128" required></label>
                </fieldset>
                <p id="error" role="alert"></p>
                <footer>
                    <button type="button" id="cancelar">Cancelar</button>
                    <button id="guardar" class="btn btn-success">Guardar</button>
                </footer>
                </form>
            </dialog>
        </main>
    </body>
</html>
